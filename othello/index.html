<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#143d2b">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>オセロ | ミニゲーム集</title>
</head>
<body>
  <main class="game-page">
    <header><a class="back-link" href="../">‹ ミニゲーム集</a><h1>オセロ</h1></header>
    <section class="scoreboard" aria-label="現在の石数"><div class="score score--black"><span class="stone black"></span><span>あなた</span><strong id="black-score">2</strong></div><p id="turn-message" role="status">あなたの番です</p><div class="score score--white"><span class="stone white"></span><span>CPU</span><strong id="white-score">2</strong></div></section>
    <div id="board" class="board" role="grid" aria-label="オセロ盤"></div>
    <p id="hint" class="hint">光っているマスをタップしてください</p>
    <button id="restart" class="restart" type="button">最初から遊ぶ</button>
  </main>
  <div id="result-dialog" class="dialog-backdrop" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="result-title"><p>GAME OVER</p><h2 id="result-title"></h2><div id="result-score"></div><button id="play-again" class="restart" type="button">もう一度遊ぶ</button></section></div>
  <script src="game.js"></script>
</body>
</html>
