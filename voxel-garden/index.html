<main><header><h1>風待ちの里</h1><a href="../" aria-label="ミニゲーム集に戻る">ゲーム一覧</a><div><button id="play">▶ 再生</button> <button id="zoom">全景</button> <button id="help">遊び方</button></div></header><section><canvas aria-label="川沿いの箱庭"></canvas><output id="note">朝の村です。▶ で住民が動き出します。</output></section><footer><button data-tool="view" class="active">眺める</button><button data-tool="bench">ベンチ</button><button data-tool="flower">花壇</button><button data-tool="road">小道</button></footer></main>
<dialog><h2>風待ちの里の暮らし</h2><p>▶ で村の一日が始まります。住民に触れると今の仕事が分かります。下の道具を選び、空いた草地に触れて配置します。ベンチには休憩中の住民が向かいます。</p><p>ドラッグで村を一周できます。「全景」で島全体を表示します。羊が逃げても羊飼いが迎えに行きます。</p><label>羊の脱走 <select id="events"><option value="on">たまに</option><option value="off">なし</option></select></label><p>配置と進行はこのブラウザに自動保存します。別タブへ移ると停止し、再開は手動です。</p><button id="closeHelp">閉じる</button></dialog>
<script>
const canvas=document.querySelector('canvas'),gl=canvas.getContext('webgl',{antialias:true,alpha:true}),N=16,key='kazemachi-v1';
const fixed=new Map(),at=(x,y)=>x+','+y;
function put(x,y,type){fixed.set(at(x,y),type)}
for(let x=0;x<N;x++)put(x,8,'road');
for(let y=1;y<15;y++)for(const x of [3,11])put(x,y,'road');
for(const [x,y,k] of [[2,3,'house'],[4,5,'house'],[12,4,'house'],[10,9,'mill'],[2,10,'house'],[12,12,'house'],[4,13,'pen'],[4,7,'wheat'],[5,7,'wheat'],[5,6,'wheat'],[10,5,'bench']])put(x,y,k);
for(let x=0;x<N;x++)for(let y=0;y<N;y++)if((x*31+y*23+x*y)%13<2&&!fixed.has(at(x,y))&&x!==7&&x!==8)put(x,y,'tree');
put(9,7,'tree');
function river(x,y){return (x===7||x===8)&&y!==8}
function walk(x,y){return x>=0&&y>=0&&x<N&&y<N&&!river(x,y)&&![ 'house','mill','tree','wheat','pen'].includes(fixed.get(at(x,y)))}

let time=0,next=42,escapeTime=-1,placed={},running=false,tool='view',near=true,pan=[0,0],unit,ox,oy;
const names=['ハル','ミナ','トト','スズ','リク','アオ','ユイ','ノノ'],colors=['#467b9d','#c46c54','#7e839d','#d79c40','#739271','#b26d84','#487c77','#ad8052'];

try{let s=JSON.parse(localStorage.getItem(key));if(s&&s.people?.length===8){time=s.time;next=s.next;escapeTime=s.escapeTime;placed=s.placed;Object.entries(placed).forEach(([k,v])=>fixed.set(k,v));people.forEach((p,i)=>Object.assign(p,s.people[i]));events.value=s.events}}catch{}
function save(){try{localStorage.setItem(key,JSON.stringify({time,next,escapeTime,placed,people,events:events.value}))}catch{note.textContent='このブラウザでは保存できません'}}
function plan(p,i){let benches=[...fixed].filter(e=>e[1]==='bench'),seat=benches.at(-1)[0].split(',').map(Number);
let stops=i<3?[[3,7,'麦を刈りに'],[11,9,'風車へ麦を運搬中'],[...seat,'ベンチでひと休み']]:[[11,2+i,'村を散歩中'],[...seat,'ベンチでひと休み'],[3,13,'羊を見に']];

let baseZ=0, angle=Math.PI/4, vertices=[], objectId=0;

 for(const face of [[4,5,6,7],[3,2,1,0],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]])poly(face.map(i=>corners[i]),color)

 let edge=.12+tier*.13;
 for(let a of [-.10+tier*.13,1-edge+.10])box(x+offset+a*scale,y+offset+(-.09+tile*.17)*scale,(1.031+tier*.14)*scale,.12*scale,.157*scale,.022*scale,roof[(tier+tile+x)%3])}}

if(k==='house'||k==='mill'){B(0,0,0,1,1,.9,'#ffe0a1');B(.35,.99,0,.27,.03,.58,'#976745');B(.99,.23,.35,.04,.32,.33,'#82bfd0');for(let j=0;j<4;j++)B(-.1+j*.13,-.1,.88+j*.14,1.2-j*.26,1.2,.15,k==='mill'?'#697f85':'#c86449');for(let h of [.18,.78])B(-.01,1,h,1.02,.035,.06,'#a16e49');for(let u of [.05,.78]){B(u,1.02,.32,.16,.04,.23,'#ffce72');B(u,1.03,.56,.21,.05,.05,'#886147')}B(.15,.15,1.2,.2,.2,.42,'#a69281');}

function person(x,y,c,load){box(x+.28,y+.28,0,.26,.22,.18,'#685843');box(x+.23,y+.23,.16,.36,.3,.3,c);box(x+.21,y+.2,.46,.38,.36,.32,'#f4c599');box(x+.19,y+.18,.73,.42,.4,.12,'#8b684d');if(load)box(x+.48,y+.4,.18,.28,.22,.29,'#edc35d')}
function flock(){let e=escapeTime<0?0:time-escapeTime;return [Math.max(0,Math.min(1,e/5,(18-e)/5)),Math.max(0,Math.min(1,(e-3)/4,(18-e)/5))]}
function height(x,y){

 if(x===9)return .34;
 let bank=x>9?.60:x===6?.10:0;

}
function actorHeight(x,y){
 let tx=Math.floor(x+.4),ty=Math.floor(y+.4);
 if(fixed.get(at(tx,ty))==='road'&&ty>0){let rise=height(tx,ty-1)-height(tx,ty);

function masonry(x,y,z){
 const stone=['#9c9689','#b1a795','#a29b8e','#b7ae9b'];
 for(let side=0;side<2;side++){
 let neighbor=side?y+1<N?height(x,y+1):-1.35:x+1<N?height(x+1,y):-1.35;
 for(let row=0;z-.16-row*.23>neighbor+.02;row++){
 let top=z-.13-row*.23,bottom=Math.max(neighbor,top-.213);
 for(let col=0;col<4;col++){let a=Math.max(0,(col-(row%2)*.5)/3),b=Math.min(1,(col+1-(row%2)*.5)/3)-.015;

 else poly([[x+1.002,y+a,bottom],[x+1.002,y+b,bottom],[x+1.002,y+b,top],[x+1.002,y+a,top]],shade(c,.79))
 }} }}
function ground(){

 for(let x=0;x<N;x++)for(let y=0;y<N;y++){
 objectId=1+x+y*N;let z=height(x,y),water=river(x,y),bridge=(x===7||x===8)&&y===8,k=fixed.get(at(x,y));
 let grass=['#adc96b','#bad57a','#a9c768','#b1ce70'][(x*11+y*13+x*y)%4];

 box(x,y,-1.07,1,1,(water||bridge?-.86:z-.101)-(-1.07),water||bridge?'#54b4ce':'#ae9271');
 if(!water&&!bridge)box(x,y,z-.10,1,1,.10,k==='road'?'#ddc89b':grass);
 if(!water&&!bridge){masonry(x,y,z);
 if(k==='road'&&y>0){let rise=height(x,y-1)-z;if(rise>.5)for(let step=0;step<4;step++)
 box(x,y+step*.25,z,1,.248,rise*(3-step)/4+.012,'#c9b99b')}
 }
 if(water||bridge){poly([[x,y,-.84],[x+1,y,-.84],[x+1,y+1,-.84],[x,y+1,-.84]],['#61c9d5','#59bfd0','#74d2d9'][(x+y)%3]);box(x+.13,y+.42,-.83,.36,.035,.012,'#b0e8e3')}
 if(bridge){for(let side of [.08,.81])box(x+.39,y+side,-.85,.18,.15,1.06,'#916747');for(let n=0;n<5;n++)box(x+n*.2,y,.12,.197,1,.13,n%2?'#c69761':'#d5ac72');}

 }
function blade(x,y,z,rotation){
 const rotor=(u,d,r)=>[x+u*Math.cos(rotation)-r*Math.sin(rotation),y+d,z+u*Math.sin(rotation)+r*Math.cos(rotation)];
 for(let [start,end,width,depth,color] of [[0,1.08,.045,.06,'#aa774b'],[.40,1.02,.18,.04,'#ffe6ad']]){
 let corners=[[start,0,0],[end,0,0],[end,depth,0],[start,depth,0],[start,0,width],[end,0,width],[end,depth,width],[start,depth,width]].map(p=>rotor(...p));
 for(let face of [[0,1,5,4],[2,3,7,6],[4,5,6,7],[0,3,2,1],[1,2,6,5],[3,0,4,7]])poly(face.map(i=>corners[i]),color)
 }}

function shader(type,source){const sh=gl.createShader(type);gl.shaderSource(sh,source);gl.compileShader(sh);if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(sh));return sh}

let fixedCount=0,movingCount=0,layout=-1;
function build(){

 for(let [key,k] of fixed){const [x,y]=key.split(',').map(Number);objectId=1+x+y*N;baseZ=height(x,y);drawObj(x,y,k);detail(x,y,k)}
 baseZ=0;for(let x of [7,8])for(let edge of [.02,.94]){objectId=1+x+8*N;box(x,8+edge,.25,.09,.07,.37,'#99724a');box(x,8+edge,.54,1,.065,.075,'#d1a571')}

}

let lastScene='';

 if(!pick&&state===lastScene)return;lastScene=state;

function hit(px,py){draw(true);let rgba=new Uint8Array(4);gl.readPixels(Math.floor(px*canvas.width/canvas.clientWidth),canvas.height-1-Math.floor(py*canvas.height/canvas.clientHeight),1,1,gl.RGBA,gl.UNSIGNED_BYTE,rgba);lastScene='';draw();return rgba[0]+rgba[1]*256}
let last=0,lastSave=0;function frame(t){if(running){advance(Math.min(.09,(t-last)/1000));if(t-lastSave>4000){save();lastSave=t}}last=t;draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function run(v){running=v;play.textContent=v?'Ⅱ 停止':'▶ 再生';if(!v)save()}
play.onclick=()=>{run(!running);note.textContent=running?'村の一日が始まります。':'一時停止中'};zoom.onclick=()=>{near=!near;pan=[0,0];zoom.textContent=near?'全景':'拡大'};help.onclick=()=>document.querySelector('dialog').showModal();closeHelp.onclick=()=>document.querySelector('dialog').close();events.onchange=save;document.onvisibilitychange=()=>{if(document.hidden)run(false)};window.addEventListener('pagehide',save);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(v=>v.classList.toggle('active',v===b));note.textContent=tool==='view'?'気になる住民に触れてみましょう。':'置きたい草地に触れてください。'});
let start;canvas.onpointerdown=e=>{start=[e.clientX,e.clientY,angle];canvas.setPointerCapture(e.pointerId)};canvas.onpointercancel=()=>start=null;canvas.onpointermove=e=>{if(start)angle=start[2]+(e.clientX-start[0])*.008};canvas.onpointerup=e=>{if(!start)return;let moved=Math.hypot(e.clientX-start[0],e.clientY-start[1]);start=null;if(moved>7)return;let rect=canvas.getBoundingClientRect(),px=e.clientX-rect.left,py=e.clientY-rect.top;let id=hit(px,py);if(tool==='view'){let p=people[id-300];if(p)note.textContent=p.name+'　'+p.job;return}
let tile=id-1,x=tile%N,y=Math.floor(tile/N),k=at(x,y);if(!walk(x,y)||fixed.has(k)){note.textContent='水辺や使用中の土地には置けません。空いた草地を選んでください。';return}put(x,y,tool);placed[k]=tool;note.textContent='配置しました。';save()};
</script></html>
