<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#143d2b">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>ポーションソート | ミニゲーム集</title>
</head>
<body>
  <main class="game-page">
    <header><a class="back-link" href="../">‹ ミニゲーム集</a><h1>ポーションソート</h1><p>同じ色をひとつのボトルにそろえよう</p></header>
    <section class="status" aria-live="polite"><strong id="moves">0手</strong><span id="stage">ステージ 1</span><span id="message">ボトルを選んでください</span></section>
    <div id="bottles" class="bottles" aria-label="ポーションのボトル"></div>
    <section class="controls" aria-label="ゲーム操作"><button id="undo" type="button" disabled>↶ 1手戻す</button><button id="restart" type="button">↻ やり直す</button></section>
    <section class="rules"><h2>遊び方</h2><p>ボトルをタップして選び、移動先をタップ。空のボトル、または一番上が同じ色のボトルにだけ移せます。</p></section>
  </main>
  <div id="result-dialog" class="dialog-backdrop" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="result-title"><p>COMPLETED!</p><h2 id="result-title">クリア！</h2><p id="result-text"></p><button id="play-again" type="button">次のステージへ</button></section></div>
  <script src="game.js"></script>
</body>
</html>
