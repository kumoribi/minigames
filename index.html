<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#143d2b">
  <meta name="description" content="すきま時間に遊べる自分用ミニゲーム集">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles/common.css">
  <title>ミニゲーム集</title>
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">MINI GAME COLLECTION</p>
      <h1>ミニゲーム集</h1>
      <p>すきま時間に、さっと一局。</p>
    </header>
    <section aria-labelledby="game-list-title">
      <h2 id="game-list-title" class="section-title">ゲームを選ぶ</h2>
      <div class="game-grid">
        <a class="game-card" href="othello/" aria-label="オセロを遊ぶ">
          <span class="game-icon" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="game-card-content"><strong>オセロ</strong><small>CPUと対戦</small></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="game-card" href="potion-sort/" aria-label="ポーションソートを遊ぶ">
          <span class="game-icon game-icon--potion" aria-hidden="true">⚗</span>
          <span class="game-card-content"><strong>ポーションソート</strong><small>色をそろえよう</small></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="game-card" href="minesweeper/" aria-label="マインスイーパーを遊ぶ">
          <span class="game-icon game-icon--mine" aria-hidden="true">✹</span>
          <span class="game-card-content"><strong>マインスイーパー</strong><small>地雷を避けよう</small></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
        <a class="game-card" href="2048/" aria-label="2048を遊ぶ">
          <span class="game-icon game-icon--2048" aria-hidden="true">2048</span>
          <span class="game-card-content"><strong>2048</strong><small>数字を重ねよう</small></span>
          <span class="arrow" aria-hidden="true">›</span>
        </a>
      </div>
    </section>
  </main>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js');
  </script>
</body>
</html>
