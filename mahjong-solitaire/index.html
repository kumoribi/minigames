<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b281d">
  <meta name="description" content="積み上がった麻雀牌から同じ図柄のペアを取り除く麻雀ソリティア">
  <link rel="stylesheet" href="style.css?v=15">
  <link rel="stylesheet" href="effects.css?v=2">
  <title>麻雀ソリティア | ミニゲーム集</title>
</head>
<body>
  <main class="game-shell">
    <a class="back-link" href="../">‹ ミニゲーム集</a>

    <header class="hero">
      <div>
        <p class="eyebrow">MAHJONG SOLITAIRE</p>
        <h1>麻雀ソリティア</h1>
        <p class="subtitle">表向きの同じ牌を2枚そろえよう</p>
      </div>
      <button id="sound" class="icon-button" type="button" aria-label="効果音と振動を切り替える" aria-pressed="true">
        <span aria-hidden="true">🔊</span>
      </button>
    </header>

    <section class="setup-card" aria-label="ゲーム設定">
      <label class="difficulty-label" for="difficulty">
        <span>難易度</span>
        <select id="difficulty">
          <option value="easy">かんたん・36枚</option>
          <option value="normal">ふつう・72枚</option>
          <option value="hard">むずかしい・108枚</option>
        </select>
      </label>
      <span id="board-id" class="board-id"></span>
    </section>

    <section class="status-grid" aria-label="ゲーム状況">
      <div><small>残り</small><strong id="remaining">0</strong></div>
      <div><small>取れる組</small><strong id="pairs">0</strong></div>
      <div><small>得点</small><strong id="score">0</strong></div>
      <div><small>時間</small><strong id="time">0:00</strong></div>
    </section>

    <div class="progress-track" aria-hidden="true"><i id="progress-bar"></i></div>

    <section id="board" aria-label="麻雀牌の山">
      <div class="table-glow" aria-hidden="true"></div>
      <div id="effect-layer" aria-hidden="true"></div>
      <div id="combo" aria-live="polite"></div>
      <div id="confetti" aria-hidden="true"></div>
    </section>

    <p id="message" class="message" role="status" aria-live="polite">表向きの牌を選んでください</p>

    <nav class="actions" aria-label="ゲーム操作">
      <button id="hint" class="primary-action" type="button"><span aria-hidden="true">💡</span> ヒント</button>
      <button id="undo" type="button" disabled><span aria-hidden="true">↶</span> 戻す</button>
      <button id="shuffle" type="button"><span aria-hidden="true">⤨</span> シャッフル</button>
      <button id="restart" class="quiet-action" type="button"><span aria-hidden="true">↻</span> 新しい山</button>
    </nav>

    <details class="rules">
      <summary>遊び方</summary>
      <p>表向きの同じ牌を2枚選ぶと取り除けます。上に牌がなく、左右どちらかが空いている牌だけ取得できます。</p>
      <p>素早く続けてそろえるとコンボになり、得点と演出が強くなります。</p>
    </details>
  </main>

  <div id="restart-dialog" class="modal" hidden>
    <section role="dialog" aria-modal="true" aria-labelledby="restart-title">
      <p class="dialog-mark" aria-hidden="true">◇</p>
      <h2 id="restart-title">新しい山にしますか？</h2>
      <p>現在の山の進行は失われます。</p>
      <div class="dialog-actions">
        <button id="restart-cancel" type="button">続ける</button>
        <button id="restart-confirm" class="primary-action" type="button">新しい山へ</button>
      </div>
    </section>
  </div>

  <div id="dialog" class="modal clear-modal" hidden>
    <section role="dialog" aria-modal="true" aria-labelledby="clear-title">
      <p class="dialog-mark" aria-hidden="true">✦</p>
      <small>ALL CLEAR!</small>
      <h2 id="clear-title">山を制覇！</h2>
      <p id="result"></p>
      <button id="again" class="primary-action" type="button">次の山へ</button>
    </section>
  </div>

  <script src="game.js?v=14"></script>
</body>
</html>
